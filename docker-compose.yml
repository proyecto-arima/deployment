services:

  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    profiles: ["deploy"]
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data/nginx-proxy-manager:/data
      - ./letsencrypt:/etc/letsencrypt

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

  mongo:
    image: mongo
    restart: unless-stopped
    profiles: ["mongo"]
    # healthcheck:
    #   test: ["CMD","mongosh", "--eval", "db.adminCommand('ping')"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 5s
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - ./data/db:/data/db

  backend:
    image: ghcr.io/proyecto-arima/backend:${LATEST_TAG}
    container_name: backend
    profiles: ["backend"]
    restart: always
    ports:
      - 8080:8080
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN}
 
      - HOST=${HOSTNAME}
      - PORT=${PORT}
      - FRONTEND_URL=${FRONTEND_URL}

      - JWT_SECRET=${JWT_SECRET}
      - COMMON_RATE_LIMIT_WINDOW_MS=${COMMON_RATE_LIMIT_WINDOW_MS}
      - COMMON_RATE_LIMIT_MAX_REQUESTS=${COMMON_RATE_LIMIT_MAX_REQUESTS}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL_HOST=${GOOGLE_CALLBACK_URL_HOST}

      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SENDER=${SMTP_SENDER}
      - SMTP_AUTH_TYPE=login

      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - BUCKET=${BUCKET}
      - PREFIX=${PREFIX}

      - IMAGES_BUCKET=${IMAGES_BUCKET}

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORGANIZATION=${OPENAI_ORGANIZATION}

  webapp:
    image: ghcr.io/proyecto-arima/webapp:${LATEST_TAG}
    container_name: webapp
    profiles: ["webapp"]
    restart: always
    ports:
      - 3000:3000
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - GENERATE_SOURCEMAP=false

  iaservice:
    image: ghcr.io/proyecto-arima/ia-service:${LATEST_TAG}
    container_name: iaservice
    profiles: ["iaservice"]
    restart: always
    command: bash -c "while true; do python main.py; python audio.py; sleep 3600; done"
    environment:
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=adaptaria
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - BUCKET=${BUCKET}
      - PREFIX=${PREFIX}
      - PUBLIC_BUCKET=${IMAGES_BUCKET}

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: smtp4dev
    restart: unless-stopped
    profiles: ["smtp4dev"]
    ports:
      - 2025:25
      - 3001:80
    volumes:
      - ./data/smtp4dev:/var/smtp4dev

  

volumes:
  portainer_data:
